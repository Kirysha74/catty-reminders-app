name: CD - Deploy Application

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -p 2476 course.prafdin.ru >> ~/.ssh/known_hosts
    
    - name: Deploy to server via SSH
      run: |
        echo "🚀 Deploying application via SSH port 2476..."
        ssh -p 2476 kirillok01@course.prafdin.ru << 'ENDSSH'
          cd /home/ubuntu/catty-reminders-app
          echo "Current directory: $(pwd)"
          
          echo "📥 Pulling latest code from GitHub..."
          git pull origin lab3
          
          echo "🐳 Deploying with Docker..."
          # Останавливаем и удаляем старый контейнер
          docker stop catty-app || true
          docker rm catty-app || true
          
          # Собираем новый образ (если нужно)
          docker build -t catty-reminders:latest .
          
          # Запускаем новый контейнер
          docker run -d \
            --name catty-app \
            --restart unless-stopped \
            -p 8181:8181 \
            catty-reminders:latest
          
          echo "✅ Deployment completed!"
          docker ps | grep catty-app
        ENDSSH
    
    - name: Verify deployment
      run: |
        echo "🚀 Application deployed successfully!"
        echo "📅 Deployment time: $(date)"
        echo "🌐 Application URL: http://app.trofimov.course.prafdin.ru"
