name: CD - Deploy to Server

on:
  release:
    types: [published, released]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies (on GitHub runner)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Deploy to server via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: course.prafdin.ru
        port: 2476  # SSH порт через FRP (убедитесь, что он правильный!)
        username: kirillok01
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          echo "🚀 Starting deployment..."
          
          # Переходим в директорию приложения
          cd /home/ubuntu/catty-reminders-app
          
          # Обновляем код из репозитория
          git fetch origin
          git checkout main
          git pull origin main
          
          # Обновляем зависимости Python
          if [ -f "requirements.txt" ]; then
            pip3 install -r requirements.txt --break-system-packages
          fi
          
          # Перезапускаем приложение через systemd
          sudo systemctl daemon-reload
          sudo systemctl restart catty-reminders
          
          # Проверяем статус службы
          sudo systemctl status catty-app --no-pager
          
          echo "✅ Deployment completed!"
          echo "🌐 App is available at: http://app.trofimov.course.prafdin.ru"
          
    - name: Verify deployment
      run: |
        echo "Waiting for app to start..."
        sleep 10
        curl -f http://app.trofimov.course.prafdin.ru || echo "App might be starting..."
