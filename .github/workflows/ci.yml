name: CI - Tests

on:
  push:
    branches: [ "main", "github-actions" ]
  pull_request:
    branches: [ "main", "github-actions" ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest
        
    - name: Run unit tests
      run: |
        python -m pytest tests/ -v -k "unit" --junitxml=unit-test-results.xml
        
    - name: Upload unit test results
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-results
        path: unit-test-results.xml
        
  api-tests:
    runs-on: ubuntu-latest
    needs: unit-tests  # Запускаем после unit тестов
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest requests
        
    - name: Start test application
      run: |
        # Запускаем ваше приложение
        python -m app.main &
        echo $! > server.pid
        sleep 15
        
    - name: Run API tests
      run: |
        python -m pytest tests/test_api.py -v --junitxml=api-test-results.xml
        
    - name: Stop test application
      if: always()
      run: |
        kill $(cat server.pid) 2>/dev/null || true
        
    - name: Upload API test results
      uses: actions/upload-artifact@v4
      with:
        name: api-test-results
        path: api-test-results.xml
        
  ui-tests:
    runs-on: ubuntu-latest
    needs: api-tests  # Запускаем после API тестов
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libnss3 \
          libnspr4 \
          libatk1.0-0 \
          libatk-bridge2.0-0 \
          libcups2 \
          libdrm2 \
          libdbus-1-3 \
          libxkbcommon0 \
          libatspi2.0-0 \
          libxcomposite1 \
          libxdamage1 \
          libxfixes3 \
          libxrandr2 \
          libgbm1 \
          libpango-1.0-0 \
          libcairo2 \
          libasound2t64
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest playwright pytest-playwright
        
    - name: Install Playwright browsers
      run: |
        python -m playwright install chromium
        
    - name: Start test application
      run: |
        python -m app.main &
        echo $! > server.pid
        sleep 15
        
    - name: Run UI tests
      run: |
        python -m pytest tests/test_ui.py -v \
          --browser chromium \
          --headless \
          --junitxml=ui-test-results.xml
          
    - name: Stop test application
      if: always()
      run: |
        kill $(cat server.pid) 2>/dev/null || true
        
    - name: Upload UI test results
      uses: actions/upload-artifact@v4
      with:
        name: ui-test-results
        path: ui-test-results.xml
        
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install flake8
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
