name: CI - Tests

on:
  push:
    branches: [ "main", "github-actions" ]
  pull_request:
    branches: [ "main", "github-actions" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
       
    - name: Create test inputs.json (if not exists)
      run: |
        if [ ! -f "inputs.json" ]; then
          echo '{
            "base_url": "http://app.trofimov.course.prafdin.ru",
            "users": [
              {
                "username": "testuser",
                "password": "testpass"
              },
              {
                "username": "testuser2",
                "password": "testpass2"
              }
            ]
          }' > inputs.json
        fi
        
    - name: Run unit tests
      run: |
        if [ -f "tests/test_unit.py" ]; then
          python -m pytest tests/test_unit.py -v
        else
          echo "Unit tests not found, skipping."
        fi
        
    - name: Run API tests
      run: |
        if [ -f "tests/test_api.py" ]; then
          python -m pytest tests/test_api.py -v
        else
          echo "API tests not found, skipping."
        fi
        
    - name: Run UI tests (headless)
      run: |
        if [ -f "tests/test_ui.py" ]; then
          python -m pytest tests/test_ui.py -v
        else
          echo "UI tests not found, skipping."
        fi
        
    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
