name: CI - Tests and Docker Build

on:
  push:
    branches: [ "main", "multicontainers" ]
  pull_request:
    branches: [ "main", "multicontainers" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run unit tests
      run: |
        if [ -f "tests/test_unit.py" ]; then
          python -m pytest tests/test_unit.py -v
        else
          echo "Unit tests not found, skipping."
        fi

  docker-build:
    runs-on: ubuntu-latest
    needs: test  # Запускаем только если тесты прошли
    if: github.event_name == 'push'  # Собираем только при пуше, не при PR
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Dockerfile Lint (optional)
      run: |
        docker run --rm -i hadolint/hadolint < Dockerfile || echo "Hadolint found issues"
      continue-on-error: true
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          latest
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
