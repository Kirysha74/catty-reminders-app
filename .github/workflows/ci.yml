name: CI - Build and Push Docker Image

on:
  push:
    branches: [ "main", "multicontainers" ]
  pull_request:
    branches: [ "main", "multicontainers" ]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ghcr.io/kirysha74/catty-reminders-app:latest
          ghcr.io/kirysha74/catty-reminders-app:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Verify pushed image
      run: |
        echo "✅ Image pushed successfully!"
        echo "📦 Tags:"
        echo "  - ghcr.io/kirysha74/catty-reminders-app:latest"
        echo "  - ghcr.io/kirysha74/catty-reminders-app:${{ github.sha }}"
