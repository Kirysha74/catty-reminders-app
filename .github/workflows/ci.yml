name: 🚀 Lab 3 - Docker Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [ lab3 ]
    paths:
      - 'Dockerfile'
      - 'app/**'
      - 'requirements.txt'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/ci.yml'
      - 'templates/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Debug info
      run: |
        echo "🔧 Lab 3 - Docker Deployment"
        echo "📦 Repository: ${{ github.repository }}"
        echo "🔑 Actor: ${{ github.actor }}"
        echo "🌐 Event: ${{ github.event_name }}"
        echo "📡 Branch: ${{ github.ref_name }}"
    
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: course.prafdin.ru
        port: 2476
        username: kirillok01
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          echo "=== 🐳 Lab 3: Docker Deployment ==="
          echo "📦 Pulling image from GitHub Container Registry..."
          
          # Логинимся в GitHub Container Registry
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          # Тянем образ
          echo "⬇️ Pulling ghcr.io/${{ github.repository }}:lab3"
          docker pull ghcr.io/kirysha74/catty-reminders-app:lab3
          
          echo "🛑 Stopping old container..."
          docker stop catty-app || true
          docker rm catty-app || true
          
          echo "▶️ Starting new container..."
          docker run -d \
            --name catty-app \
            --restart unless-stopped \
            -p 8181:8181 \
            -e PORT=8181 \
            ghcr.io/kirysha74/catty-reminders-app:lab3
          
          echo "⏳ Waiting for app to start..."
          sleep 5
          
          echo "📊 Container status:"
          docker ps | grep catty-app
          
          echo "📝 Container logs:"
          docker logs catty-app --tail 10 || true
          
          echo ""
          echo "✅ Docker container deployed successfully!"
          echo "📡 Application: http://app.trofimov.course.prafdin.ru"
          echo ""
          echo "📊 Architecture:"
          echo "- 🔨 CI: builds and pushes to GHCR"
          echo "- 🚀 CD: pulls from GHCR and deploys"
