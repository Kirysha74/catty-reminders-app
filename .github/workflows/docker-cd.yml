name: 🚀 CD - Deploy with Docker Compose

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: course.prafdin.ru
        port: 2476
        username: kirillok01
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          echo "=== 🐳 Deploying with Docker Compose ==="
          
          # Переходим в директорию проекта
          cd /home/ubuntu/catty-reminders-app || exit 1
          
          # Сохраняем важные файлы (на случай если их нет в репозитории)
          if [ -f config.json ]; then
            cp config.json /tmp/config.json.bak
          fi
          
          # Обновляем код (принудительно)
          git fetch origin
          git reset --hard origin/${{ github.ref_name }}
          
          # Восстанавливаем config.json если нужно
          if [ -f /tmp/config.json.bak ] && [ ! -f config.json ]; then
            cp /tmp/config.json.bak config.json
          fi
          
          # Убеждаемся что config.json существует
          if [ ! -f config.json ]; then
            echo "❌ config.json not found!"
            exit 1
          fi
          
          # Логинимся в GHCR для pull образа
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          # Останавливаем старый стек (сохраняем данные)
          docker compose down
          
          # Загружаем свежий образ
          docker compose pull app
          
          # Запускаем новый стек
          docker compose up -d
          
          # Проверяем статус
          echo "📊 Container status:"
          docker compose ps
          
          # Проверяем логи приложения
          echo "📝 App logs:"
          sleep 5
          docker compose logs app --tail 20
          
          echo "✅ Deployment complete!"
          echo "📡 App: http://app.trofimov.course.prafdin.ru"
