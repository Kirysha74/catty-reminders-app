# .github/workflows/deploy.yml
name: CD - Docker Compose Deploy

on:
  release:
    types: [published, released]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (default: latest)'
        required: false
        default: 'latest'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy with Docker Compose
      uses: appleboy/ssh-action@v1.0.0
      env:
        REGISTRY: ghcr.io
        IMAGE_NAME: kirysha74/catty-reminders-app
        TAG: ${{ inputs.tag || 'latest' }}
      with:
        host: course.prafdin.ru
        port: 2476
        username: kirillok01
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          echo "🚀 Deploying with Docker Compose..."
          echo "📦 Image: $REGISTRY/$IMAGE_NAME:$TAG"
          
          # Логинимся в GHCR для возможности pull образа
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login $REGISTRY -u ${{ github.actor }} --password-stdin
          
          # Переходим в директорию проекта
          cd /home/ubuntu/catty-reminders-app || cd /home/runner/work/catty-reminders-app/catty-reminders-app
          
          # Обновляем код (на всякий случай, чтобы получить свежий docker-compose.yml)
          git fetch origin
          git reset --hard origin/${{ github.ref_name }}
          
          # Останавливаем старый стек, сохраняя данные (volumes)
          docker compose down
          
          # Загружаем свежий образ приложения
          docker compose pull app
          
          # Запускаем новый стек в фоне
          docker compose up -d
          
          # Проверяем статус
          echo "📊 Container status:"
          docker compose ps
          
          # Проверяем логи приложения
          echo "📝 App logs:"
          sleep 5
          docker compose logs app --tail 20
          
          echo "✅ Deployment completed!"
