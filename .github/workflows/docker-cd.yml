name: 🚀 CD - Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (tag)'
        required: true
        default: 'lab3'
        type: choice
        options:
          - lab3
          - latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Debug info
      run: |
        echo "🚀 CD Pipeline triggered"
        echo "📦 Event: ${{ github.event_name }}"
        echo "🔖 Release: ${{ github.event.release.tag_name }}"
        echo "🎯 Version: ${{ github.event.inputs.version || 'lab3' }}"
    
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: course.prafdin.ru
        port: 2476
        username: kirillok01
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          echo "=== 🐳 CD: Deploying to Production ==="
          echo "📅 $(date)"
          
          # Определяем версию для деплоя
          VERSION="${{ github.event.inputs.version || 'lab3' }}"
          echo "🎯 Deploying version: $VERSION"
          
          # Логинимся в GHCR
          echo "🔑 Logging in to GHCR..."
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          # Сохраняем текущий image ID
          CURRENT_IMAGE=$(docker inspect catty-app --format='{{.Image}}' 2>/dev/null || echo "none")
          
          # Тянем образ указанной версии
          echo "⬇️ Pulling ghcr.io/kirysha74/catty-reminders-app:$VERSION"
          docker pull ghcr.io/kirysha74/catty-reminders-app:$VERSION
          
          # Получаем ID нового образа
          NEW_IMAGE=$(docker image inspect ghcr.io/kirysha74/catty-reminders-app:$VERSION --format='{{.Id}}' 2>/dev/null)
          
          # Перезапускаем если образ изменился
          if [ "$CURRENT_IMAGE" != "$NEW_IMAGE" ] || [ "$CURRENT_IMAGE" = "none" ]; then
            echo "🔄 Deploying new version..."
            
            docker stop catty-app || true
            docker rm catty-app || true
            
            docker run -d \
              --name catty-app \
              --restart unless-stopped \
              -p 8181:8181 \
              -e PORT=8181 \
              ghcr.io/kirysha74/catty-reminders-app:$VERSION
            
            echo "⏳ Waiting for app..."
            sleep 5
            
            # Проверка
            if docker ps | grep -q catty-app; then
              echo "✅ Production deployment successful!"
            else
              echo "❌ Deployment failed!"
              docker logs catty-app --tail 20
              exit 1
            fi
          else
            echo "✅ Version $VERSION already deployed"
          fi
          
          # Финальный статус
          echo ""
          echo "📊 Production container:"
          docker ps --filter name=catty-app --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"
          
          echo ""
          echo "📝 Recent logs:"
          docker logs catty-app --tail 10
          
          echo ""
          echo "✅ CD completed!"
          echo "📡 App: http://app.trofimov.course.prafdin.ru"
