name: catty-reminders

services:
  postgres:
    image: postgres:15-alpine
    container_name: catty-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: catty
      POSTGRES_PASSWORD: cattypassword
      POSTGRES_DB: cattydb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catty"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/kirysha74/catty-reminders-app:lab4
    container_name: catty-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://catty:cattypassword@postgres:5432/cattydb
      PORT: 8181
    ports:
      - "8181:8181"
    volumes:
      - app_uploads:/app/uploads

volumes:
  postgres_data:
    name: catty-postgres-data
  app_uploads:
    name: catty-uploads
