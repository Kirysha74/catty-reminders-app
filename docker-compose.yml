version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: cattydb
      POSTGRES_USER: cattyuser
      POSTGRES_PASSWORD: cattypass
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    image: ghcr.io/kirysha74/catty-reminders-app:latest
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://cattyuser:cattypass@db:5432/cattydb
      PORT: 8181
    ports:
      - "8181:8181"

volumes:
  postgres_data:
