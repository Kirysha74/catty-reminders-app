services:
  mysql:
    image: mysql:8.0
    container_name: catty-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cattydb
      MYSQL_USER: catty
      MYSQL_PASSWORD: cattypass
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - catty-network

  app:
    image: $REGISTRY/$IMAGE_NAME:$TAG
    container_name: catty-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: cattydb
      MYSQL_USER: catty
      MYSQL_PASSWORD: cattypass
      MYSQL_PORT: 3306
      PORT: 8181
    ports:
      - "8181:8181"
    networks:
      - catty-network

volumes:
  mysql_data:

networks:
  catty-network:
    driver: bridge
